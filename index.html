<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Craft Realm 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Simplex Noise for Infinite Chunk Terrain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>
    
    <!-- 십자선 (1인칭 모드 전용) -->
    <div id="crosshair"></div>

    <!-- 상단 상태 & 메뉴 제어바 -->
    <header id="top-bar">
        <button id="btn-menu" class="mc-btn">메뉴</button>
        <div id="dimension-badge" class="mc-badge">차원: <span id="dim-label">오버월드</span></div>
        <button id="btn-perspective" class="mc-btn">시점 전환 (1P/3P)</button>
    </header>

    <!-- 설정 / 메뉴 모달 UI -->
    <div id="menu-modal" class="hidden">
        <div class="modal-content mc-panel">
            <h2 class="mc-title">게임 설정</h2>
            
            <div class="setting-item">
                <label for="chunk-slider">오버월드 청크 로딩 거리: <span id="chunk-val">2</span></label>
                <input type="range" id="chunk-slider" min="1" max="4" value="2" step="1">
            </div>

            <div class="setting-item">
                <label>차원 이동</label>
                <div class="btn-group">
                    <button class="mc-btn dim-select" onclick="switchDimension('overworld')">오버월드</button>
                    <button class="mc-btn dim-select" onclick="switchDimension('nether')">네더월드</button>
                    <button class="mc-btn dim-select" onclick="switchDimension('ender')">엔더월드</button>
                </div>
            </div>

            <button id="btn-close-menu" class="mc-btn font-bold">닫기</button>
        </div>
    </div>

    <!-- 하단 HUD (체력, 허기, 핫바) -->
    <div id="hud">
        <div class="status-bar">
            <div id="hearts-container" class="mc-status-row"></div>
            <div id="food-container" class="mc-status-row"></div>
        </div>
        <div id="hotbar" class="mc-panel">
            <div class="slot selected" onclick="selectSlot(0)"><div class="block-icon grass"></div></div>
            <div class="slot" onclick="selectSlot(1)"><div class="block-icon dirt"></div></div>
            <div class="slot" onclick="selectSlot(2)"><div class="block-icon stone"></div></div>
            <div class="slot" onclick="selectSlot(3)"><div class="block-icon wood"></div></div>
            <div class="slot" onclick="selectSlot(4)"><div class="block-icon ether"></div></div>
        </div>
    </div>

    <!-- 터치 및 제스처용 원형 조이스틱 영역 -->
    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-handle"></div>
        </div>
    </div>

    <!-- 모바일 터치 전용 행동 버튼 -->
    <div id="mobile-controls">
        <button id="btn-jump" class="action-btn mc-btn">점프</button>
        <button id="btn-break" class="action-btn mc-btn btn-danger">파괴</button>
        <button id="btn-place" class="action-btn mc-btn btn-success">설치</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
